[project]
name = "dart"
version = "3.0.0"
description = "DART v3.0 - State-of-the-Art Deep Adaptive Reinforcement Trader with LLM Integration"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    # Data Processing & Validation
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    
    # Machine Learning & Deep Learning
    "scikit-learn>=1.6.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "catboost>=1.2.7",
    "joblib>=1.4.2",
    
    # PyTorch Ecosystem
    "torch>=2.4.0",
    "triton; sys_platform == 'linux'",
    
    # Transformers & Embeddings
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.23.0",
    "tokenizers>=0.15.2",
    
    # API & Networking
    "websockets>=11.0.3",
    "httpx>=0.28.0",
    
    # LLM Local Client & Engine
    "langchain>=0.2.5",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.8",
    "openai>=1.42.0",
    
    # Data Visualization
    "matplotlib>=3.9.0",
    "mplfinance>=0.12.10b0",
    "plotly>=5.20.0",
    
    # Web Dashboard
    "streamlit>=1.41.0",
    "dash>=2.15.0",
    "dash-bootstrap-components>=1.5.0",
    
    # Logging
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    
    # Testing
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.0",
    
    # Desktop UI
    "customtkinter>=5.2.2",
    "sv-ttk>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipython>=8.29.0",
    "jupyter>=1.1.1",
]

deep-learning = [
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "tensorboard>=2.17.0",
    "accelerate>=1.1.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
]

llm = [
    "chromadb>=0.4.24",
    "langchain>=0.2.5",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.8",
    "openai>=1.42.0",
    "llama-index>=0.11.0",
]

market-data = [
    "yfinance>=0.2.38",
]

monitoring = [
    "mlflow>=2.14.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

all = [
    "dart[dev,deep-learning,llm,market-data,monitoring]",
]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "config", "ml", "ui", "utils"]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["models", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "B", "SIM", "RUF", "N", "PT"]
ignore = ["E501", "W292", "N999", "B008", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "B011", "PT011"]
"ui/*" = ["N802", "N803", "N806", "E402", "SIM105"]
"ml/trading_ai_v3.py" = ["N806", "N803"]
"main.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_decorators = false
pretty = true
cache_dir = "/tmp/.mypy_cache"

[[tool.mypy.overrides]]
module = "ui.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["api", "config", "ml", "ui", "utils"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
prerelease = "allow"
index-strategy = "unsafe-best-match"


[tool.uv.sources]
vllm = { index = "vllm-nightly" }
torch = { index = "pytorch-nightly" }
torchvision = { index = "pytorch-nightly" }
torchaudio = { index = "pytorch-nightly" }
triton = { index = "pytorch-nightly-cpu" }

[[tool.uv.index]]
name = "vllm-nightly"
url = "https://wheels.vllm.ai/nightly"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly"
explicit = true



