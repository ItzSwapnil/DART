[project]
name = "scratch-test"
version = "0.1.0"
description = "Minimal test project"
readme = "README.md"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    "torch>=2.4.0",
    "triton; sys_platform == 'linux'",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
prerelease = "allow"

[tool.uv.sources]
torch = { index = "pytorch-nightly" }
triton = { index = "pytorch-nightly-cpu" }

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-nightly-cpu"
url = "https://download.pytorch.org/whl/nightly"
explicit = true
